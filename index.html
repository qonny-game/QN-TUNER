<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QNTUNER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="appHeader">
  <div id="appHeaderText">
    <h1 id="appLogo"><span id="appLogoAccent">QN</span>TUNER <span id="appVersion">v1.6.0</span></h1>
    <p id="appTitle">Mic Tuner &amp; Tone Generator</p>
  </div>
</header>

<main class="app-container">

  <!-- ==================== Mic Tuner screen ==================== -->
  <section class="screen" id="screen-mic">

    <div class="control-card mic-permission" id="micPermission">
      <div class="mic-permission-icon">🎙</div>
      <p class="mic-permission-text">Allow microphone access, then play a note<br>to see your pitch in real time</p>
      <button class="btn-primary" id="btnStartMic">Start Mic</button>
      <p class="mic-permission-note" id="micErrorNote"></p>
    </div>

    <div class="control-card meter-wrap" id="meterWrap" hidden>

      <div class="gauge">
        <svg class="gauge-svg" viewBox="0 0 300 170" aria-hidden="true">
          <path class="gauge-track" d="M 20 160 A 130 130 0 0 1 280 160" />
          <path class="gauge-zone-flat" d="M 20 160 A 130 130 0 0 1 95 45" />
          <path class="gauge-zone-in" d="M 108 33 A 130 130 0 0 1 192 33" />
          <path class="gauge-zone-sharp" d="M 205 45 A 130 130 0 0 1 280 160" />
          <g id="needle" class="needle" style="transform: rotate(0deg)">
            <line x1="150" y1="160" x2="150" y2="45" />
            <circle cx="150" cy="160" r="7" />
          </g>
        </svg>
        <div class="gauge-labels">
          <span>♭</span>
          <span>IN TUNE</span>
          <span>♯</span>
        </div>
      </div>

      <div class="reading">
        <div class="note-display" id="noteDisplay">—</div>
        <div class="freq-display"><span id="freqValue">0.0</span> Hz</div>
        <div class="cents-display" id="centsDisplay">Play a note</div>
      </div>
    </div>

  </section>

  <!-- ==================== Tone Generator screen ==================== -->
  <section class="screen" id="screen-tone" hidden>

    <div class="preset-tabs" id="presetTabs">
      <button class="preset-tab is-active" data-preset="guitar">Guitar</button>
      <button class="preset-tab" data-preset="bass">Bass</button>
      <button class="preset-tab" data-preset="ukulele">Ukulele</button>
      <button class="preset-tab" data-preset="chromatic">Wind (Chromatic)</button>
    </div>

    <div class="tuning-tabs" id="tuningTabs"></div>

    <div class="control-card tone-card">
      <div class="string-list" id="stringList"></div>
    </div>

    <p class="kbd-hint">
      <kbd>1</kbd>–<kbd>6</kbd> toggle strings &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> switch preset &nbsp;·&nbsp; <kbd>Space</kbd> stop
    </p>

  </section>

</main>

<!-- ==================== Bottom fixed control bar ==================== -->
<footer class="bottom-bar" id="bottomBar">

  <div class="bottom-now" id="toneNow" hidden>
    <span class="bottom-now-note" id="toneNowNote">—</span>
    <span class="bottom-now-freq"><span id="toneNowFreq">0.0</span> Hz</span>
    <button class="bottom-now-stop" id="btnStopTone">Stop</button>
  </div>

  <div class="bottom-controls">
    <button class="bottom-btn is-active" id="btnStartMic2" data-mode="mic">
      <span class="bottom-btn-icon">🎙</span>
      <span class="bottom-btn-text">Mic</span>
    </button>
    <button class="bottom-btn" id="btnToneMode" data-mode="tone">
      <span class="bottom-btn-icon">〜</span>
      <span class="bottom-btn-text">Tone</span>
    </button>
    <button class="bottom-btn bottom-btn-stop" id="btnStopMic2" hidden>
      <span class="bottom-btn-icon">■</span>
      <span class="bottom-btn-text">Stop</span>
    </button>
  </div>

</footer>

<script src="player.js"></script>
</body>
</html>
