<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QNTUNER</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="blue">

<header id="appHeader">
  <div id="appHeaderText">
    <h1 id="appLogo"><span id="appLogoAccent">QN</span>TUNER <span id="appVersion">v1.8.1</span></h1>
    <p id="appTitle">Mic Tuner &amp; Tone Generator</p>
  </div>

  <div id="headerControls">
    <div class="header-btn-wrapper">
      <button id="colorToggleBtn" title="Change Color Theme">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.1 0 2-.9 2-2 0-.51-.19-.97-.5-1.32-.31-.35-.5-.81-.5-1.32 0-1.1.9-2 2-2h2.35c2.03 0 3.65-1.62 3.65-3.65C21 6.36 17.04 2 12 2zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Color</span>
      </button>
      <div class="color-popup" id="colorPopup">
        <div class="theme-swatches">
          <div class="theme-swatch swatch-red" data-theme="red" title="Red"></div>
          <div class="theme-swatch swatch-orange" data-theme="orange" title="Orange"></div>
          <div class="theme-swatch swatch-amber" data-theme="amber" title="Amber Gold"></div>
          <div class="theme-swatch swatch-lime" data-theme="lime" title="Lime"></div>
          <div class="theme-swatch swatch-emerald" data-theme="emerald" title="Emerald Green"></div>
          <div class="theme-swatch swatch-teal" data-theme="teal" title="Teal"></div>
          <div class="theme-swatch swatch-cyan" data-theme="cyan" title="Cyan"></div>
          <div class="theme-swatch swatch-sky" data-theme="sky" title="Sky Blue"></div>
          <div class="theme-swatch swatch-blue active" data-theme="blue" title="Blue (Default)"></div>
          <div class="theme-swatch swatch-indigo" data-theme="indigo" title="Indigo"></div>
          <div class="theme-swatch swatch-purple" data-theme="purple" title="Electric Purple"></div>
          <div class="theme-swatch swatch-violet" data-theme="violet" title="Violet"></div>
          <div class="theme-swatch swatch-pink" data-theme="pink" title="Pink"></div>
          <div class="theme-swatch swatch-rose" data-theme="rose" title="Rose Red"></div>
          <div class="theme-swatch swatch-rainbow" data-theme="rainbow" title="Rainbow (Animated)"></div>
        </div>
        <div class="glow-toggle-row">
          <span class="glow-toggle-label">Glow current color</span>
          <button id="glowToggleBtn" class="glow-switch" role="switch" aria-checked="false" title="Fade the current color in and out">
            <span class="glow-switch-knob"></span>
          </button>
        </div>
      </div>
    </div>
    <div class="header-btn-wrapper">
      <button id="shortcutsToggleBtn" title="Keyboard Shortcuts">
        <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
        <span>Shortcuts</span>
      </button>
      <div class="shortcuts-popup" id="shortcutsPopup">
        <table class="shortcut-table">
          <thead>
            <tr><th>Key</th><th>Action</th></tr>
          </thead>
          <tbody>
            <tr><td><kbd>Space</kbd></td><td>Stop current tone</td></tr>
            <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Switch preset</td></tr>
            <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>Switch tuning</td></tr>
            <tr><td><kbd>1</kbd> – <kbd>9</kbd></td><td>Toggle note on/off</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</header>

<main class="app-container">

  <!-- ==================== Mic Tuner screen ==================== -->
  <section class="screen" id="screen-mic">

    <div class="control-card mic-permission" id="micPermission">
      <div class="mic-permission-icon">🎙</div>
      <p class="mic-permission-text">Allow microphone access, then play a note<br>to see your pitch in real time</p>
      <button class="btn-primary" id="btnStartMic">Start Mic</button>
      <p class="mic-permission-note" id="micErrorNote"></p>
    </div>

    <div class="control-card meter-wrap" id="meterWrap" hidden>

      <div class="gauge">
        <svg class="gauge-svg" viewBox="0 0 300 170" aria-hidden="true">
          <path class="gauge-track" d="M 20 160 A 130 130 0 0 1 280 160" />
          <path class="gauge-zone-flat" d="M 20 160 A 130 130 0 0 1 95 45" />
          <path class="gauge-zone-in" d="M 108 33 A 130 130 0 0 1 192 33" />
          <path class="gauge-zone-sharp" d="M 205 45 A 130 130 0 0 1 280 160" />
          <g id="needle" class="needle" style="transform: rotate(0deg)">
            <line x1="150" y1="160" x2="150" y2="45" />
            <circle cx="150" cy="160" r="7" />
          </g>
        </svg>
        <div class="gauge-labels">
          <span>♭</span>
          <span>IN TUNE</span>
          <span>♯</span>
        </div>
      </div>

      <div class="reading">
        <div class="note-display" id="noteDisplay">—</div>
        <div class="freq-display"><span id="freqValue">0.0</span> Hz</div>
        <div class="cents-display" id="centsDisplay">Play a note</div>
      </div>

      <button class="btn-secondary" id="btnStopMicInline">Stop Mic</button>
    </div>

  </section>

  <!-- ==================== Tone Generator screen ==================== -->
  <section class="screen" id="screen-tone" hidden>

    <div class="preset-tabs" id="presetTabs">
      <button class="preset-tab is-active" data-preset="guitar">Guitar</button>
      <button class="preset-tab" data-preset="bass">Bass</button>
      <button class="preset-tab" data-preset="ukulele">Ukulele</button>
      <button class="preset-tab" data-preset="chromatic">Wind (Chromatic)</button>
    </div>

    <div class="tuning-tabs" id="tuningTabs"></div>

    <div class="control-card tone-card">
      <div class="string-list" id="stringList"></div>
    </div>

    <div class="control-card bottom-now" id="toneNow" hidden>
      <span class="bottom-now-note" id="toneNowNote">—</span>
      <span class="bottom-now-freq"><span id="toneNowFreq">0.0</span> Hz</span>
      <button class="bottom-now-stop" id="btnStopTone">Stop</button>
    </div>

  </section>

</main>

<!-- ==================== Bottom fixed control bar (mobile only) ==================== -->
<footer class="bottom-bar" id="bottomBar">

  <div class="bottom-controls">
    <button class="bottom-btn is-active" id="btnStartMic2" data-mode="mic">
      <span class="bottom-btn-icon">🎙</span>
      <span class="bottom-btn-text">Mic</span>
    </button>
    <button class="bottom-btn" id="btnToneMode" data-mode="tone">
      <span class="bottom-btn-icon">〜</span>
      <span class="bottom-btn-text">Tone</span>
    </button>
    <button class="bottom-btn bottom-btn-stop" id="btnStopMic2" hidden>
      <span class="bottom-btn-icon">■</span>
      <span class="bottom-btn-text">Stop</span>
    </button>
  </div>

</footer>

<script src="player.js"></script>
</body>
</html>
